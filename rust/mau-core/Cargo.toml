[package]
name = "mau-core"
description = "Media Audio Utility: change default audio and subtitle tracks of media files"
version.workspace = true
edition.workspace = true
# what the dependencies in Cargo.lock need (checked in CI)
rust-version = "1.85"
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
unicode-normalization.workspace = true
sha2 = "0.10"
# the zlib streams of compressed Matroska blocks (PGS subtitles are often stored this way); pure Rust, already in the tree
miniz_oxide = "0.8"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# the build without mkvtoolnix: MKV work is done with ffmpeg (for the App Store build)
no-mkvtoolnix = []
# the build without ffmpeg or ffprobe either (`build.sh --sandboxed --nolgpl`): it has no LGPL or GPL code.
# A change that needs ffmpeg is refused with a message, before the file is touched (see model::ffmpeg_hidden)
no-ffmpeg = []
# read an MKV's tracks from its header in this program (see ebml.rs), not with ffprobe
native-mkv = []
native-mp4 = []
native-avi = []
native-detect = []
